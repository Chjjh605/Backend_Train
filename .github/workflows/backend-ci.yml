name: Backend CI/CD (Build & GitOps Update)

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

env:
  AWS_REGION: ap-northeast-2
  ECR_REPOSITORY: team-train-dev-backend
  TRAIN_REPO: hjin-2e/Train_repo # 매니페스트 레포지토리 (수정 완료)

# OIDC 토큰 발급을 위해 필수
permissions:
  id-token: write
  contents: read

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout Code
      uses: actions/checkout@v3

    - name: Configure AWS credentials
      uses: aws-actions/configure-aws-credentials@v4
      with:
        role-to-assume: ${{ secrets.AWS_BACKEND_ROLE_ARN }} # terraform output: github_actions_backend_role_arn
        aws-region: ${{ env.AWS_REGION }}

    - name: Login to Amazon ECR
      id: login-ecr
      uses: aws-actions/amazon-ecr-login@v1

    - name: Build, tag, and push image to Amazon ECR
      id: build-image
      env:
        ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
        IMAGE_TAG: ${{ github.sha }}
      run: |
        docker build -t $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG .
        docker push $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG
        
        echo "image=$ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG" >> $GITHUB_OUTPUT

    # GitOps: Kustomize 이미지 변경 및 매니페스트 레포지토리에 푸시
    - name: Update K8s Manifest Repository (GitOps)
      if: github.ref == 'refs/heads/main'
      env:
        ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
        IMAGE_TAG: ${{ github.sha }}
        PAT: ${{ secrets.GITOPS_PAT }} # 백엔드 레포 Secrets에 등록한 PAT
      run: |
        # 매니페스트 레포지토리 Clone
        git clone https://x-access-token:${PAT}@github.com/${{ env.TRAIN_REPO }}.git train-repo
        cd train-repo
        
        # Dev 환경 Kustomize 이미지 변경
        cd modules/infra/k8s-manifests/overlays/dev
        kustomize edit set image team-train-dev-backend=$ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG
        
        # 커밋 및 푸시
        git config user.name "github-actions[bot]"
        git config user.email "github-actions[bot]@users.noreply.github.com"
        git commit -am "Update backend image tag to $IMAGE_TAG for dev"
        git push origin main

